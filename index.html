<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      color: white;
      font-family: Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .large-text {
      font-size: 48px;
      padding: 20px;
      align-self: flex-start;
    }

    .input-box {
      padding: 20px;
    }

    input[type="text"] {
      width: 200px;
      padding: 8px;
      font-size: 14px;
      font-family: Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div class="large-text">Website</div>
  <div class="input-box">
    <input type="text" value="Milo Field">
  </div>
</body>
</html>
